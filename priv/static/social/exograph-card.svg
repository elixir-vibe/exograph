<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Exograph — Elixir code search</title>
  <desc id="desc">Search Hex package source code with structural Elixir queries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#18181b"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="65%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="56" y="56" width="1088" height="518" rx="32" fill="none" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="2"/>
  <text x="96" y="154" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700">Exograph</text>
  <text x="96" y="274" fill="#fafafa" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="82" font-weight="800">Exograph</text>
  <text x="96" y="350" fill="#e4e4e7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="600">Elixir package code search</text>
  <text x="96" y="432" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30">structural queries · text search · call graph facts</text>
  <text x="96" y="506" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28">from(f in Fragment, where: matches(f, "def _ do ... end"))</text>
</svg>
